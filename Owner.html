<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Money - Owner Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { background: #f5f5f5; padding: 20px; }
        h1 { color: #1a73e8; margin-bottom: 20px; }
        .stats { display: flex; gap: 20px; margin-bottom: 30px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; }
        .card h3 { color: #666; font-size: 14px; }
        .card h2 { color: #1a73e8; font-size: 28px; margin-top: 10px; }
        .section { background: white; padding: 20px; border-radius: 10px; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, select, button { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #1a73e8; color: white; border: none; cursor: pointer; }
        button:hover { background: #1557b0; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #1a73e8; color: white; }
        .deposit { color: green; font-weight: bold; }
        .withdraw { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🏦 Apex Money Guinée - Owner Portal</h1>

    <!-- STATS -->
    <div class="stats">
        <div class="card">
            <h3>Total Users</h3>
            <h2 id="totalUsers">0</h2>
        </div>
        <div class="card">
            <h3>Total Agents</h3>
            <h2 id="totalAgents">0</h2>
        </div>
        <div class="card">
            <h3>Transactions Today</h3>
            <h2 id="totalTx">0</h2>
        </div>
    </div>

    <!-- AGENT TRANSACTION FORM -->
    <div class="section">
        <h2>Agent: Retrait / Deposit</h2>
        <input type="text" id="userPhone" placeholder="User Phone +224...">
        <input type="number" id="amount" placeholder="Amount GNF">
        <select id="txType">
            <option value="agent_deposit">Deposit - Dépôt</option>
            <option value="agent_withdraw">Retrait - Withdraw</option>
        </select>
        <select id="platform">
            <option>Orange Money</option>
            <option>MTN MoMo</option>
            <option>Wave</option>
        </select>
        <button onclick="submitTransaction()">Submit Transaction</button>
        <p id="txResult"></p>
    </div>

    <!-- ALL ACTIVITIES TABLE -->
    <div class="section">
        <h2>All Activities - Recent Transactions</h2>
        <table id="txTable">
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Platform</th>
                    <th>User Phone</th>
                    <th>Agent</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody id="txBody">
                <tr><td colspan="6">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        const API_URL = 'http://localhost:5000'; // Change this to your Render URL when deployed

        // Load dashboard data
        async function loadDashboard() {
            try {
                let res = await fetch(API_URL + '/api/owner/dashboard');
                let data = await res.json();
                
                document.getElementById('totalUsers').innerText = data.totalUsers || 0;
                document.getElementById('totalAgents').innerText = data.totalAgents || 0;
                
                let tbody = document.getElementById('txBody');
                tbody.innerHTML = '';
                
                if(data.recentTransactions && data.recentTransactions.length > 0) {
                    data.recentTransactions.forEach(tx => {
                        let typeClass = tx.type.includes('deposit') ? 'deposit' : 'withdraw';
                        tbody.innerHTML += `
                            <tr>
                                <td class="${typeClass}">${tx.type}</td>
                                <td>${tx.amount} GNF</td>
                                <td>${tx.platform}</td>
                                <td>${tx.user_phone}</td>
                                <td>${tx.agent_phone || 'System'}</td>
                                <td>${new Date(tx.created_at).toLocaleString()}</td>
                            </tr>
                        `;
                    });
                    document.getElementById('totalTx').innerText = data.recentTransactions.length;
                }
            } catch(e) {
                console.log('Error loading:', e);
            }
        }

        // Submit agent transaction
        async function submitTransaction() {
            let body = {
                type: document.getElementById('txType').value,
                userPhone: document.getElementById('userPhone').value,
                amount: Number(document.getElementById('amount').value),
                platform: document.getElementById('platform').value,
                agentPhone: 'OWNER'
            };

            let res = await fetch(API_URL + '/api/agent/transaction', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body)
            });

            let result = await res.json();
            document.getElementById('txResult').innerText = result.success ? '✅ Transaction Successful' : '❌ Failed';
            loadDashboard(); // refresh table
        }

        // Load on start and refresh every 10 seconds
        loadDashboard();
        setInterval(loadDashboard, 10000);
    </script>
</body>
</html>
