<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Money GN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .card { backdrop-filter: blur(10px); background: rgba(255,255,255,0.9); }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-blue-50 min-h-screen p-4">
    <div class="container mx-auto max-w-4xl">
        <!-- Header -->
        <div class="card rounded-2xl shadow-lg p-6 mb-6">
            <h1 class="text-3xl font-bold text-purple-700">💰 Apex Money GN</h1>
            <p class="text-gray-600">Sauvegarde automatique dans le cloud</p>
        </div>

        <!-- Add Client Form -->
        <div class="card rounded-2xl shadow-lg p-6 mb-6">
            <h2 class="text-xl font-bold mb-4">➕ Nouveau Client</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <input id="nom" type="text" placeholder="Nom du client" class="border rounded-lg p-3">
                <input id="montant" type="number" placeholder="Montant Prêt GNF" class="border rounded-lg p-3">
                <input id="taux" type="number" placeholder="Taux % par mois" class="border rounded-lg p-3">
            </div>
            <button onclick="addClient()" class="btn-primary text-white font-bold py-3 px-6 rounded-lg mt-4 w-full">
                Enregistrer
            </button>
        </div>

        <!-- Clients List -->
        <div class="card rounded-2xl shadow-lg p-6">
            <h2 class="text-xl font-bold mb-4">📋 Liste des Clients</h2>
            <div id="clientsList" class="space-y-3">Chargement...</div>
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      // YOUR FIREBASE CONFIG
      const firebaseConfig = {
        apiKey: "AIzaSyDyqB601iwygUcojI2jl7bt7E276y2jffQ",
        authDomain: "apex-money-gn.firebaseapp.com",
        projectId: "apex-money-gn",
        storageBucket: "apex-money-gn.firebasestorage.app",
        messagingSenderId: "252239353273",
        appId: "1:252239353273:web:c5cb04b6287ca398fe5268"
      };

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // ADD CLIENT
      window.addClient = async function() {
        const nom = document.getElementById('nom').value;
        const montant = document.getElementById('montant').value;
        const taux = document.getElementById('taux').value;
        
        if(!nom || !montant || !taux) { alert("Remplissez tous les champs"); return; }

        await addDoc(collection(db, "clients"), {
          nom: nom,
          montant: Number(montant),
          taux: Number(taux),
          date: new Date()
        });

        document.getElementById('nom').value = '';
        document.getElementById('montant').value = '';
        document.getElementById('taux').value = '';
        alert("Client enregistré avec succès!");
      }

      // SHOW CLIENTS LIVE FROM FIREBASE
      const q = query(collection(db, "clients"), orderBy("date", "desc"));
      onSnapshot(q, (snapshot) => {
        let html = '';
        snapshot.forEach((doc) => {
          const data = doc.data();
          html += `
            html += `
  <div class="border-b border-purple-100 pb-3 fade-in">
    <p class="font-bold text-lg">${data.nom}</p>
    <p>Prêt: ${data.montant.toLocaleString()} GNF</p>
    <p>Taux: ${data.taux}% / mois</p>
    <button onclick="addPayment('${doc.id}', ${data.montant})" 
      class="bg-green-500 text-white px-4 py-2 rounded-lg mt-2 text-sm">
      💰 Add Payment
    </button>
  </div>
`;
              
    
        });
        document.getElementById('clientsList').innerHTML = html || "<p>Aucun client. Ajoutez-en un!</p>";
      });
    </script>
</body>
  </html>
