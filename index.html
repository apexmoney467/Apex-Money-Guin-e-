<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Money GN</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-orange-400 to-red-500 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
      <h1 class="text-3xl font-bold text-orange-600 text-center mb-2">💰 Apex Money GN</h1>
      <p class="text-center text-gray-600 mb-6">Première connexion: Créez le compte Owner</p>
      
      <input id="email" type="email" placeholder="Email" class="border w-full rounded-lg p-3 mb-3">
      <input id="password" type="password" placeholder="Mot de passe 6+ caractères" class="border w-full rounded-lg p-3 mb-3">
      <input id="nom" placeholder="Votre Nom" class="border w-full rounded-lg p-3 mb-3">
      
      <button onclick="registerOwner()" class="bg-orange-500 hover:bg-orange-600 text-white w-full py-3 rounded-lg font-bold mb-3">Créer Compte Owner</button>
      <button onclick="login()" class="bg-gray-700 hover:bg-gray-800 text-white w-full py-3 rounded-lg mb-3">Se Connecter</button>
      
      <p id="error" class="text-red-500 text-center text-sm mt-3"></p>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDyqB601iwygUcojI2jl7bt7E276y2jffQ",
        authDomain: "apex-money-gn.firebaseapp.com",
        projectId: "apex-money-gn",
        storageBucket: "apex-money-gn.firebasestorage.app",
        messagingSenderId: "252239353273",
        appId: "1:252239353273:web:c5cb04b6287ca398fe5268"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      window.registerOwner = async () => {
        document.getElementById('error').innerText = "Création en cours...";
        try {
          const email = document.getElementById('email').value;
          const pass = document.getElementById('password').value;
          const nom = document.getElementById('nom').value;
          
          const userCred = await createUserWithEmailAndPassword(auth, email, pass);
          await setDoc(doc(db, "clients", userCred.user.uid), { 
            nom: nom, 
            email: email, 
            role: 'owner', 
            montant: 1000000,
            taux: 10,
            dateCreation: new Date()
          });
          document.getElementById('error').innerText = "✅ Compte Owner créé! Rechargez la page.";
        } catch (error) {
          document.getElementById('error').innerText = "❌ Erreur: " + error.message;
        }
      }

      window.login = async () => { 
        try {
          await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); 
          document.getElementById('error').innerText = "✅ Connexion réussie!";
        } catch(error) {
          document.getElementById('error').innerText = "❌ Erreur: " + error.message;
        }
      }
    </script>
</body>
</html>
