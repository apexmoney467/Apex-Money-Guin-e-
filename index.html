<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Money GN - Super Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .btn-orange { background: linear-gradient(135deg, #FF7F00 0%, #FF5500 100%); }
    </style>
</head>
<body class="bg-gray-100">
    <div id="app"></div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, doc, setDoc, getDoc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDyqB601iwygUcojI2jl7bt7E276y2jffQ",
        authDomain: "apex-money-gn.firebaseapp.com",
        projectId: "apex-money-gn",
        storageBucket: "apex-money-gn.firebasestorage.app",
        messagingSenderId: "252239353273",
        appId: "1:252239353273:web:c5cb04b6287ca398fe5268"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      let currentUser = null;
      let userData = null;

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          const userDoc = await getDoc(doc(db, "users", user.uid));
          userData = userDoc.data();
          showMainApp();
        } else {
          showLogin();
        }
      });

      // LOGIN
      function showLogin() {
        document.getElementById('app').innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-400 to-red-500 p-4">
            <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
              <h1 class="text-3xl font-bold text-orange-600 text-center mb-6">💰 Apex Money GN</h1>
              <input id="email" type="email" placeholder="Email" class="border w-full rounded-lg p-3 mb-3">
              <div class="relative mb-3">
                <input id="password" type="password" placeholder="Mot de passe" class="border w-full rounded-lg p-3 pr-10">
                <i class="fa fa-eye absolute right-3 top-4 cursor-pointer" onclick="togglePassword()"></i>
              </div>
              <button onclick="login()" class="btn-orange text-white w-full py-3 rounded-lg font-bold mb-3">Se Connecter</button>
              <p class="text-center text-sm"><a href="#" onclick="forgotPassword()" class="text-orange-600">Mot de passe oublié?</a></p>
            </div>
          </div>
        `;
      }
      window.togglePassword = () => { document.getElementById('password').type = document.getElementById('password').type === 'password' ? 'text' : 'password' }
      window.forgotPassword = async () => { const email = prompt("Email:"); if(email) { await sendPasswordResetEmail(auth, email); alert("Email envoyé!"); }
      window.login = async () => { await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); }
      window.logout = () => signOut(auth);

      // MAIN APP WITH OWNER DASHBOARD
      function showMainApp() {
        document.getElementById('app').innerHTML = `
          <div class="flex">
            <div class="bg-orange-600 text-white w-64 min-h-screen p-4">
              <h2 class="text-2xl font-bold mb-8">💰 Apex Money</h2>
              <p class="mb-6">Bonjour ${userData.nom} - ${userData.role}</p>
              <ul class="space-y-3">
                <li><a href="#" onclick="showPage('dashboard')"><i class="fa fa-home mr-3"></i>Accueil</a></li>
                ${userData.role === 'owner' ? `
                <li><a href="#" onclick="showPage('registerUser')"><i class="fa fa-user-plus mr-3"></i>Enregistrer Utilisateur</a></li>
                <li><a href="#" onclick="showPage('manageWallet')"><i class="fa fa-wallet mr-3"></i>Gérer Portefeuille</a></li>
                <li><a href="#" onclick="showPage('sendMoney')"><i class="fa fa-paper-plane mr-3"></i>Envoi d'Argent</a></li>
                <li><a href="#" onclick="showPage('allUsers')"><i class="fa fa-users mr-3"></i>Tous les Utilisateurs</a></li>
                ` : ''}
                <li><a href="#" onclick="showPage('settings')"><i class="fa fa-cog mr-3"></i>Paramètres</a></li>
                <li><a href="#" onclick="logout()" class="text-red-300"><i class="fa fa-sign-out mr-3"></i>Déconnexion</a></li>
              </ul>
            </div>
            <div class="flex-1 p-6" id="mainContent"></div>
          </div>
        `;
        showPage('dashboard');
      }

      // PAGES
      window.showPage = function(page) {
        let html = '';
        if(page === 'dashboard') {
          html = `
            <h1 class="text-3xl font-bold mb-4">Tableau de Bord</h1>
            <div class="bg-orange-500 text-white rounded-2xl p-6">
              <p>Solde Disponible</p>
              <p class="text-4xl font-bold">${userData.solde.toLocaleString()} GNF</p>
            </div>
          `;
        }
        
        
         
// OWNER: REGISTER ANYONE
        if(page === 'registerUser' && userData.role === 'owner') {
          html = `
            <h1 class="text-3xl font-bold mb-4">Enregistrer un Nouvel Utilisateur</h1>
            <div class="bg-white p-6 rounded-xl">
              <input id="newNom" placeholder="Nom complet" class="border w-full p-3 mb-2 rounded">
              <input id="newTel" placeholder="Téléphone 62xxxxxxx" class="border w-full p-3 mb-2 rounded">
              <input id="newEmail" placeholder="Email" class="border w-full p-3 mb-2 rounded">
              <div class="relative mb-2">
                <input id="newPass" type="password" placeholder="Mot de passe" class="border w-full p-3 pr-10 rounded">
                <i class="fa fa-eye absolute right-3 top-4 cursor-pointer" onclick="toggleNewPass()"></i>
              </div>
              <select id="newRole" class="border w-full p-3 mb-4 rounded">
                <option value="client">Client</option>
                <option value="agent">Agent</option>
              </select>
              <button onclick="ownerRegisterUser()" class="btn-orange text-white px-6 py-3 rounded-lg">Créer Compte</button>
            </div>
          `;
        }

        // OWNER: ADD/REMOVE MONEY
        if(page === 'manageWallet' && userData.role === 'owner') {
          html = `
            <h1 class="text-3xl font-bold mb-4">Dépôt / Retrait Portefeuille</h1>
            <div class="bg-white p-6 rounded-xl">
              <select id="userSelect" class="border w-full p-3 mb-3 rounded"><option>Chargement...</option></select>
              <input id="amount" type="number" placeholder="Montant GNF" class="border w-full p-3 mb-3 rounded">
              <button onclick="addMoney()" class="bg-green-500 text-white px-6 py-3 rounded-lg mr-2">+ Dépôt</button>
              <button onclick="removeMoney()" class="bg-red-500 text-white px-6 py-3 rounded-lg">- Retrait</button>
            </div>
          `;
          setTimeout(loadUsersForSelect, 100);
        }

        // OWNER: SEND MONEY LIKE ORANGE MONEY
        if(page === 'sendMoney' && userData.role === 'owner') {
          html = `
            <h1 class="text-3xl font-bold mb-4">Envoi d'Argent Instantané</h1>
            <div class="bg-white p-6 rounded-xl">
              <select id="sendType" class="border w-full p-3 mb-3 rounded">
                <option value="apex">Portefeuille Apex</option>
                <option value="orange">Orange Money</option>
                <option value="mtn">MTN MoMo</option>
                <option value="wave">Wave</option>
                <option value="bank">Compte Bancaire</option>
              </select>
              <input id="sendNumber" placeholder="Numéro ou Compte" class="border w-full p-3 mb-3 rounded">
              <input id="sendAmount" type="number" placeholder="Montant GNF" class="border w-full p-3 mb-3 rounded">
              <button onclick="sendMoney()" class="btn-orange text-white px-6 py-3 rounded-lg">Envoyer Maintenant</button>
            </div>
          `;
        }

        if(page === 'allUsers' && userData.role === 'owner') {
          html = `<h1 class="text-3xl font-bold mb-4">Tous les Utilisateurs</h1><div id="allUsersList"></div>`;
          setTimeout(loadAllUsers, 100);
        }

        document.getElementById('mainContent').innerHTML = html;
      }

      // ADD THIS FUNCTION TOO - FOR SHOW PASSWORD IN REGISTER FORM
      window.toggleNewPass = () => { 
        document.getElementById('newPass').type = document.getElementById('newPass').type === 'password' ? 'text' : 'password' 
           }
