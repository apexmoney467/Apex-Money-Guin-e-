<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apex Money GN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style> .btn-orange { background: linear-gradient(135deg, #FF7F00 0%, #FF5500 100%); } </style>
</head>
<body class="bg-gray-100">
    <div id="app">Chargement...</div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
      import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

      const firebaseConfig = {
        apiKey: "AIzaSyDyqB601iwygUcojI2jl7bt7E276y2jffQ",
        authDomain: "apex-money-gn.firebaseapp.com",
        projectId: "apex-money-gn",
        storageBucket: "apex-money-gn.firebasestorage.app",
        messagingSenderId: "252239353273",
        appId: "1:252239353273:web:c5cb04b6287ca398fe5268"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);
      let currentUser = null;
      let userData = {role: 'owner', nom: 'Owner', solde: 0}; // DEFAULT

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          currentUser = user;
          const userDoc = await getDoc(doc(db, "users", user.uid));
          if(userDoc.exists()) { userData = userDoc.data(); }
          showMainApp();
        } else {
          showLogin();
        }
      });

      function showLogin() {
        document.getElementById('app').innerHTML = `
          <div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-orange-400 to-red-500 p-4">
            <div class="bg-white rounded-2xl shadow-2xl p-8 w-full max-w-md">
              <h1 class="text-3xl font-bold text-orange-600 text-center mb-2">💰 Apex Money GN</h1>
              <p class="text-center mb-6">Première connexion: Créez le compte Owner</p>
              <input id="email" type="email" placeholder="Email" class="border w-full rounded-lg p-3 mb-3">
              <input id="password" type="password" placeholder="Mot de passe" class="border w-full rounded-lg p-3 mb-3">
              <input id="nom" placeholder="Votre Nom" class="border w-full rounded-lg p-3 mb-3">
              <button onclick="registerOwner()" class="btn-orange text-white w-full py-3 rounded-lg font-bold mb-3">Créer Compte Owner</button>
              <button onclick="login()" class="bg-gray-700 text-white w-full py-3 rounded-lg">Se Connecter</button>
            </div>
          </div>
        `;
      }
      
      window.registerOwner = async () => {
        const userCred = await createUserWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value);
        await setDoc(doc(db, "users", userCred.user.uid), { 
          nom: document.getElementById('nom').value, 
          email: document.getElementById('email').value, 
          role: 'owner', 
          solde: 1000000 // Start with 1M GNF
        });
        alert("Compte Owner créé!");
      }
      
      window.login = async () => { 
        await signInWithEmailAndPassword(auth, document.getElementById('email').value, document.getElementById('password').value); 
      }
      window.logout = () => signOut(auth);

      function showMainApp() {
        document.getElementById('app').innerHTML = `
          <div class="flex">
            <div class="bg-orange-600 text-white w-64 min-h-screen p-4">
              <h2 class="text-2xl font-bold mb-8">💰 Apex Money</h2>
              <p class="mb-6">Bonjour ${userData.nom}</p>
              <ul class="space-y-3">
                <li><a href="#" onclick="alert('Dashboard')"><i class="fa fa-home mr-3"></i>Accueil</a></li>
                <li><a href="#" onclick="logout()" class="text-red-300"><i class="fa fa-sign-out mr-3"></i>Déconnexion</a></li>
              </ul>
            </div>
            <div class="flex-1 p-6">
              <h1 class="text-3xl font-bold mb-4">Tableau de Bord</h1>
              <div class="bg-orange-500 text-white rounded-2xl p-6">
                <p>Solde Disponible</p>
                <p class="text-4xl font-bold">${userData.solde.toLocaleString()} GNF</p>
              </div>
            </div>
          </div>
        `;
      }
    </script>
</body>
    </html>
